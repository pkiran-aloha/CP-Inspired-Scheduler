name: Build & deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # PR checks get their own group so they never cancel a main deploy
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install deps (ci if lock exists, install if not)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json not found at root, running npm install"
            ls -la
            if [ -f CP-Inspired-Scheduler/package-lock.json ]; then
              echo "Found nested lock file, moving to root"
              mv CP-Inspired-Scheduler/* . 2>/dev/null || true
              mv CP-Inspired-Scheduler/.* . 2>/dev/null || true
              rmdir CP-Inspired-Scheduler 2>/dev/null || true
            fi
            if [ -f aba-scheduler/package-lock.json ]; then
              mv aba-scheduler/* . 2>/dev/null || true
              rmdir aba-scheduler 2>/dev/null || true
            fi
            npm install
          fi
      - run: npm test -- --run
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
